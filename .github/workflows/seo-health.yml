name: SEO health

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

jobs:
  crawlability:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Read-only public SEO check
        run: node scripts/seo-health.mjs > seo-health.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-health
          path: seo-health.json
