<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AYN Autofill — Options</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 540px; margin: 40px auto; padding: 20px; background: #0b0f17; color: #e6e8ec; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { color: #8b93a3; }
    input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #1f2735; background: #131b29; color: #e6e8ec; font-size: 13px; font-family: monospace; box-sizing: border-box; }
    button { padding: 10px 16px; border-radius: 8px; border: none; background: #2563eb; color: #fff; cursor: pointer; font-weight: 600; margin-top: 10px; }
    button.ghost { background: transparent; color: #94a3b8; border: 1px solid #1f2735; margin-left: 8px; }
    .status { padding: 10px; border-radius: 8px; margin-top: 12px; font-size: 13px; }
    .ok { background: rgba(34,197,94,.1); color: #4ade80; }
    .err { background: rgba(239,68,68,.1); color: #f87171; }
    ol { color: #8b93a3; line-height: 1.7; }
    code { background: #131b29; padding: 2px 6px; border-radius: 4px; color: #93c5fd; }
  </style>
</head>
<body>
  <h1>AYN Autofill</h1>
  <p>Connect this device to your AYN account.</p>

  <ol>
    <li>Open <a href="https://aynn.io/resume-hub" target="_blank">AYN → Resume Hub → Extension tab</a>.</li>
    <li>Click <strong>Generate token</strong>.</li>
    <li>Copy the token and paste it below.</li>
  </ol>

  <input id="token" placeholder="ayn_..." />
  <div>
    <button id="save">Connect device</button>
    <button id="clear" class="ghost">Disconnect</button>
  </div>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
